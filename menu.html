<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú | Bella Notte</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-stone-50">

    <nav class="w-full flex justify-between items-center px-6 md:px-16 py-6 text-black bg-white/90 backdrop-blur-md border-b sticky top-0 z-50">
        <div class="text-2xl font-bold font-serif italic tracking-tighter">BELLA NOTTE</div>
        <div class="flex items-center space-x-6">
            <a href="index.html" class="text-sm font-bold hover:text-orange-600 transition" data-i18n="nav_back">← Inicio</a>
            <button id="lang-toggle" class="border border-stone-300 px-3 py-1 rounded text-xs font-bold uppercase">EN</button>
        </div>
    </nav>

    <main class="py-20 px-6 max-w-4xl mx-auto min-h-screen">
        <header class="text-center mb-20">
            <h1 class="text-6xl font-serif italic mb-4" data-i18n="menu_title">Il Menu</h1>
            <p class="text-stone-500 uppercase tracking-widest text-sm" data-i18n="menu_subtitle"></p>
        </header>

        <div class="space-y-16">
            <div>
                <h2 class="text-3xl font-serif italic border-b-2 border-orange-200 pb-2 mb-10 text-stone-800" data-i18n="cat_pasta">Le Paste</h2>
                <div class="flex justify-between items-end">
                    <div class="flex-1">
                        <h3 class="text-xl font-bold text-stone-700 uppercase" data-i18n="plate_1">Fettuccine al Pesto</h3>
                        <p class="text-stone-500 italic text-sm" data-i18n="desc_1"></p>
                    </div>
                    <span class="text-xl font-serif text-orange-700 ml-4">$210</span>
                </div>
            </div>
            <div>
                <h2 class="text-3xl font-serif italic border-b-2 border-orange-200 pb-2 mb-10 text-stone-800" data-i18n="cat_pizza">Pizze Gourmet</h2>
                <div class="flex justify-between items-end">
                    <div class="flex-1">
                        <h3 class="text-xl font-bold text-stone-700 uppercase" data-i18n="plate_2">Pizza Margherita</h3>
                        <p class="text-stone-500 italic text-sm" data-i18n="desc_2"></p>
                    </div>
                    <span class="text-xl font-serif text-orange-700 ml-4">$245</span>
                </div>
            </div>
        </div>
    </main>

    <footer class="py-16 text-center bg-stone-950 text-white">
        <p class="text-stone-500 text-xs tracking-widest uppercase">Made With Love By Zelttzz ❤️</p>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="translations.js"></script>
    <script src="scripts.js"></script>
</body>
</html>
