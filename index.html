<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bella Notte Cozumel | Reservas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-stone-50 overflow-x-hidden">

    <nav class="fixed w-full z-50 flex justify-between items-center px-6 md:px-16 py-6 transition-all duration-300 text-white" id="navbar">
        <div class="text-2xl font-bold font-serif italic tracking-tighter text-orange-500">BELLA NOTTE</div>
        <div class="flex items-center space-x-8">
            <a href="menu.html" class="hover:text-orange-400 transition font-medium" data-i18n="nav_menu">Menú</a>
            <button id="lang-toggle" class="bg-white/10 border border-white/20 px-3 py-1 rounded text-xs font-bold uppercase">EN</button>
            <a href="#reservar" class="bg-orange-600 text-white px-6 py-2 rounded-full text-sm font-bold hover:bg-orange-700 transition" data-i18n="nav_reserve">Reservar</a>
        </div>
    </nav>

    <header class="relative h-[80vh] flex items-center justify-center">
        <img src="https://images.unsplash.com/photo-1516280440614-37939bbacd81?q=80&w=2070&auto=format&fit=crop" class="absolute inset-0 w-full h-full object-cover">
        <div class="absolute inset-0 bg-black/50"></div>
        <div class="relative text-center text-white px-4" data-aos="zoom-in">
            <h1 class="text-6xl md:text-8xl font-serif mb-6 italic" data-i18n="hero_title">Sabor Italiano</h1>
        </div>
    </header>

    <section id="reservar" class="py-24 bg-stone-900 text-white">
        <div class="max-w-5xl mx-auto px-6 grid md:grid-cols-2 gap-16 items-center">
            <div data-aos="fade-right">
                <h2 class="text-5xl font-serif mb-6 italic" data-i18n="reserva_title">Reserva tu Mesa</h2>
                <p class="text-stone-400 mb-8" data-i18n="reserva_subtitle"></p>
                <div class="flex space-x-4">
                    <a href="#" class="social-icon">FB</a>
                    <a href="#" class="social-icon">IG</a>
                    <a href="#" class="social-icon">TA</a>
                </div>
            </div>

            <form id="reservaForm" class="bg-white p-8 rounded-3xl text-black shadow-2xl" data-aos="fade-left">
                <div class="space-y-4">
                    <input type="text" id="nombre" placeholder="Tu Nombre" required class="w-full p-4 bg-stone-100 rounded-xl outline-none focus:ring-2 focus:ring-orange-600 transition">
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="email" id="email" placeholder="Correo Electrónico" required class="p-4 bg-stone-100 rounded-xl outline-none focus:ring-2 focus:ring-orange-600 transition">
                        <input type="tel" id="telefono" placeholder="Teléfono" required class="p-4 bg-stone-100 rounded-xl outline-none focus:ring-2 focus:ring-orange-600 transition">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <input type="date" id="fecha" required class="p-4 bg-stone-100 rounded-xl outline-none focus:ring-2 focus:ring-orange-600 transition">
                        <input type="time" id="hora" required class="p-4 bg-stone-100 rounded-xl outline-none focus:ring-2 focus:ring-orange-600 transition">
                    </div>
                    
                    <button type="submit" class="w-full bg-stone-900 text-white py-4 rounded-xl font-bold hover:bg-orange-600 transition duration-300">
                        Confirmar Reserva
                    </button>
                </div>
            </form>
        </div>
    </section>

    <footer class="py-12 text-center bg-stone-950 text-white">
        <p class="font-serif italic text-2xl mb-4 text-orange-500">Bella Notte</p>
        <a href="login.html" class="text-stone-600 hover:text-stone-400 text-[10px] uppercase tracking-widest">Admin Access</a>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="translations.js"></script>
    <script src="scripts.js"></script>
</body>
</html>
