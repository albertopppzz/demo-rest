<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Admin Bella Notte</title>
</head>
<body class="bg-stone-100 font-sans p-8">
    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-10">
            <h1 class="text-3xl font-serif italic text-orange-600">Panel de Reservas</h1>
            <button onclick="sessionStorage.clear(); window.location.href='login.html'" class="text-red-600 font-bold uppercase text-xs">Salir</button>
        </div>
        <div class="bg-white rounded-3xl shadow-xl overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-stone-50 border-b">
                    <tr>
                        <th class="p-6">Cliente</th><th class="p-6">Fecha/Hora</th><th class="p-6">Estado</th><th class="p-6 text-right">Acciones</th>
                    </tr>
                </thead>
                <tbody id="lista"></tbody>
            </table>
        </div>
    </div>
    <script>
        if(sessionStorage.getItem('isAdmin') !== 'true') window.location.href = 'login.html';
        function load() {
            const list = document.getElementById('lista');
            const data = JSON.parse(localStorage.getItem('reservas')) || [];
            list.innerHTML = data.slice().reverse().map(r => {
                let color = r.status === 'confirmada' ? 'bg-green-100 text-green-700' : (r.status === 'cancelada' ? 'bg-red-100 text-red-700' : 'bg-yellow-100 text-yellow-700');
                return `
                <tr class="border-b">
                    <td class="p-6"><b>${r.nombre}</b><br><span class="text-xs text-stone-400">${r.email}</span></td>
                    <td class="p-6">${r.fecha}<br>${r.hora}</td>
                    <td class="p-6"><span class="${color} px-3 py-1 rounded-full text-[10px] font-bold uppercase">${r.status}</span></td>
                    <td class="p-6 text-right">
                        <button onclick="upd(${r.id}, 'confirmada')" class="text-green-600 mr-4">Confirmar</button>
                        <button onclick="upd(${r.id}, 'cancelada')" class="text-red-600">Cancelar</button>
                    </td>
                </tr>`;
            }).join('');
        }
        function upd(id, s) {
            let d = JSON.parse(localStorage.getItem('reservas'));
            let i = d.findIndex(x => x.id === id);
            d[i].status = s;
            localStorage.setItem('reservas', JSON.stringify(d));
            load();
        }
        load();
    </script>
</body>
</html>
