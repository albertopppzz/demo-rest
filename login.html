<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Bella Notte</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-900 h-screen flex items-center justify-center font-sans">
    <div class="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-sm">
        <h2 class="text-2xl font-serif italic text-center mb-8">Admin Access</h2>
        <form id="loginForm" class="space-y-4">
            <input type="text" id="user" placeholder="Usuario" class="w-full p-4 bg-stone-100 rounded-xl outline-none">
            <input type="password" id="pass" placeholder="Contraseña" class="w-full p-4 bg-stone-100 rounded-xl outline-none">
            <button type="submit" class="w-full bg-orange-600 text-white py-4 rounded-xl font-bold uppercase tracking-widest hover:bg-orange-700 transition">Entrar</button>
        </form>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            if(document.getElementById('user').value === 'admin' && document.getElementById('pass').value === 'admin') {
                sessionStorage.setItem('isAdmin', 'true');
                window.location.href = 'admin.html';
            } else { alert('Acceso denegado'); }
        });
    </script>
</body>
</html>
