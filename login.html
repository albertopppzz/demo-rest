<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin | Bella Notte</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="bg-stone-100 h-screen flex items-center justify-center font-['Inter']">
    <div class="bg-white p-10 rounded-3xl shadow-xl w-full max-w-md border border-stone-200">
        <div class="text-center mb-8">
            <h1 class="font-serif italic text-3xl text-stone-800">Bella Notte Admin</h1>
            <p class="text-stone-500 text-sm mt-2 uppercase tracking-widest">Acceso restringido</p>
        </div>
        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-xs font-bold uppercase text-stone-600 mb-2">Usuario</label>
                <input type="text" id="user" class="w-full p-4 bg-stone-50 border border-stone-200 rounded-xl outline-none focus:ring-2 focus:ring-orange-600 transition" placeholder="admin">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-stone-600 mb-2">Contraseña</label>
                <input type="password" id="pass" class="w-full p-4 bg-stone-50 border border-stone-200 rounded-xl outline-none focus:ring-2 focus:ring-orange-600 transition" placeholder="admin">
            </div>
            <button type="submit" class="w-full bg-stone-900 text-white py-4 rounded-xl font-bold hover:bg-orange-600 transition duration-300">Entrar al Panel</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            
            if(u === 'admin' && p === 'admin') {
                sessionStorage.setItem('isAdmin', 'true');
                window.location.href = 'admin.html';
            } else {
                alert('Credenciales incorrectas');
            }
        });
    </script>
</body>
</html>
